<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Cover</title>
  <style>
    :root {
      --white: #fffdfa;
      --cream: rgba(255, 249, 229, 0.72);
      --ink: rgba(34, 37, 38, 0.72);
      --paper: #fcfbf0;
      --section-ink: rgba(110, 111, 111, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--white);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      cursor: crosshair;
    }

    .opening {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: var(--white);
    }

    .section02 {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--section-ink);
      pointer-events: none;
    }

    body.can-scroll {
      height: auto;
      min-height: 100%;
      overflow-y: auto;
      cursor: default;
    }

    body.can-scroll .opening {
      position: fixed;
    }

    .scroll-space {
      display: none;
      height: 980vh;
    }

    body.can-scroll .scroll-space {
      display: block;
    }

    .story-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: #fff;
      opacity: 0;
      transform: translate3d(0, 100%, 0);
      pointer-events: none;
      transform-origin: left top;
      will-change: transform, opacity;
    }

    body.can-scroll .story-stage {
      pointer-events: auto;
    }

    .story-stage.can-click-page09 {
      pointer-events: auto;
      cursor: pointer;
    }

    .story-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%) scale(var(--story-fit, 1));
      transform-origin: center center;
    }

    .story-img,
    .story-text {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      user-select: none;
      pointer-events: none;
      transform-origin: left top;
      will-change: transform, opacity;
    }

    .story-img {
      object-fit: cover;
    }

    .piece {
      width: 408px;
      height: 306px;
      z-index: 3;
    }

    .complete-photo {
      width: 810px;
      height: 1080px;
      z-index: 2;
      opacity: 0;
    }

    .later-photo {
      opacity: 0;
      z-index: 1;
    }

    .photo-house,
    .photo-wall {
      width: 529px;
      height: 659px;
    }

    .photo-interior {
      width: 527px;
      height: 659px;
    }

    .photo-shoes {
      width: 529px;
      height: 661px;
    }

    .story-text {
      z-index: 8;
      height: auto;
      opacity: 1;
    }

    .story-text--one {
      width: 236px;
    }

    .story-text--two {
      width: 321px;
    }

    .page07-block,
    .page08-block,
    .page09-block {
      position: absolute;
      inset: 0;
      z-index: 8;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transform-origin: left top;
      will-change: transform, opacity;
    }

    .page07-photo {
      position: absolute;
      left: 421px;
      top: 235px;
      width: 1078px;
      height: 607px;
      object-fit: cover;
      opacity: 0.86;
    }

    .page07-text {
      position: absolute;
      left: 577px;
      top: 746px;
      width: 765px;
      height: auto;
      opacity: 0;
      will-change: transform, opacity;
    }

    .page08-object,
    .page09-object {
      position: absolute;
      display: block;
      height: auto;
      user-select: none;
      pointer-events: auto;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      transition: translate 1300ms cubic-bezier(0.22, 0.68, 0.15, 1);
      translate: 0 0;
      cursor: default;
    }

    .page08-object:hover,
    .page09-object:hover {
      translate: 0 -9px;
    }

    .page08-object {
      opacity: 0;
      filter: saturate(0.9) contrast(0.98);
    }

    .page08-object--one {
      left: 390px;
      top: 318px;
      width: 249px;
    }

    .page08-object--two {
      left: 688px;
      top: 354px;
      width: 254px;
    }

    .page08-object--three {
      left: 1001px;
      top: 340px;
      width: 263px;
    }

    .page08-object--four {
      left: 1290px;
      top: 356px;
      width: 265px;
    }

    .page08-text-wrap {
      position: absolute;
      left: 530px;
      top: 741px;
      width: 879px;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
      opacity: 0;
      will-change: clip-path, opacity;
    }

    .page08-text-wrap img {
      display: block;
      width: 879px;
      height: auto;
    }

    .page08-block {
      pointer-events: auto;
    }

    .page09-block {
      position: fixed;
      z-index: 30;
      transform: none;
    }

    .page09-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%) scale(var(--story-fit, 1));
      transform-origin: center center;
      pointer-events: none;
    }

    .page09-object {
      opacity: 0;
      filter: blur(0);
      pointer-events: none;
    }

    .page09-object--one {
      left: 410px;
      top: 340px;
      width: 240px;
    }

    .page09-object--two {
      left: 664px;
      top: 365px;
      width: 287px;
    }

    .page09-object--three {
      left: 994px;
      top: 352px;
      width: 278px;
    }

    .page09-object--four {
      left: 1294px;
      top: 370px;
      width: 258px;
    }

    .page09-trigger {
      position: fixed;
      left: 50%;
      bottom: 38px;
      z-index: 24;
      width: 58px;
      height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      opacity: 0;
      transform: translate3d(-50%, 10px, 0);
      pointer-events: none;
      transition:
        opacity 1200ms cubic-bezier(0.22, 0.68, 0.15, 1),
        transform 1200ms cubic-bezier(0.22, 0.68, 0.15, 1);
      cursor: pointer;
    }

    .page09-trigger::before {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      top: 12px;
      height: 1px;
      background: rgba(83, 84, 84, 0.38);
    }

    .page09-trigger.is-visible {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
      pointer-events: auto;
    }

    .page09-block.is-active {
      pointer-events: auto;
    }

    .page09-block.is-active .page09-frame {
      pointer-events: auto;
    }

    .page09-block.is-active .page09-object {
      pointer-events: auto;
    }

    .section02__copy {
      position: absolute;
      left: 50%;
      top: 36.4vh;
      width: min(76vw, 1460px);
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
    }

    .section02__title,
    .section02__body-line {
      display: block;
      height: auto;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transform: translateY(26px);
      transition-property: opacity, transform;
      transition-timing-function: cubic-bezier(0.22, 0.68, 0.15, 1);
      will-change: opacity, transform;
    }

    .section02__title {
      width: min(35.05vw, 673px);
      min-width: 480px;
      margin-bottom: 2.35rem;
    }

    .section02__body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.42rem;
    }

    .section02__body-line {
      max-width: min(61vw, var(--line-width, 1050px));
      width: var(--line-width, 1000px);
    }

    .section02__body-line--01 {
      --line-width: 979px;
    }

    .section02__body-line--02 {
      --line-width: 1026px;
    }

    .section02__body-line--03 {
      --line-width: 1150px;
    }

    .section02__body-line--04 {
      --line-width: 937px;
    }

    .section02__butterfly {
      position: absolute;
      z-index: 1;
      height: auto;
      opacity: 0;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 8px 10px rgba(118, 114, 74, 0.08));
      transform:
        translate3d(var(--from-x), var(--from-y), 0)
        rotate(var(--start-rotate))
        scale(var(--start-scale));
      transition:
        opacity 2200ms cubic-bezier(0.22, 0.68, 0.15, 1),
        transform 4700ms cubic-bezier(0.2, 0.64, 0.1, 1);
      transition-delay: var(--delay, 0ms);
      will-change: transform, opacity;
    }

    .section02__butterfly--large {
      left: 4.25vw;
      top: 56.8vh;
      width: min(22.4vw, 330px);
      --from-x: -34vw;
      --from-y: 20vh;
      --start-rotate: -14deg;
      --start-scale: 0.98;
      --float-x: 9px;
      --float-y: -12px;
      --float-rotate: 1.4deg;
      --delay: 120ms;
    }

    .section02__butterfly--small {
      right: 12.1vw;
      top: 17.4vh;
      width: min(10.6vw, 166px);
      --from-x: 26vw;
      --from-y: -16vh;
      --start-rotate: 11deg;
      --start-scale: 0.96;
      --float-x: -7px;
      --float-y: 9px;
      --float-rotate: -1.2deg;
      --delay: 520ms;
    }

    .section02.is-entering .section02__butterfly {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    }

    .section02.is-entering .section02__title {
      opacity: 1;
      transform: translateY(0);
      transition-duration: 2600ms;
      transition-delay: 3650ms;
    }

    .section02.is-entering .section02__body-line {
      opacity: 1;
      transform: translateY(0);
      transition-duration: 2300ms;
    }

    .section02.is-entering .section02__body-line:nth-child(1) {
      transition-delay: 4700ms;
    }

    .section02.is-entering .section02__body-line:nth-child(2) {
      transition-delay: 5230ms;
    }

    .section02.is-entering .section02__body-line:nth-child(3) {
      transition-delay: 5760ms;
    }

    .section02.is-entering .section02__body-line:nth-child(4) {
      transition-delay: 6290ms;
    }

    .section02.is-settled .section02__butterfly {
      animation: butterflyDrift 8.5s ease-in-out infinite alternate;
    }

    .section02.is-settled .section02__butterfly--small {
      animation-duration: 9.8s;
      animation-delay: -1.6s;
    }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      background: #e9f2f4;
    }

    .cover.is-hidden {
      display: none;
    }

    .cover__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(0.91) contrast(0.94) brightness(1.045);
      transform: scale(1.002);
    }

    .cover__veil {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .cover__title {
      position: absolute;
      top: 15.55vh;
      left: 50%;
      width: min(35.08vw, 673px);
      min-width: 420px;
      height: auto;
      transform: translateX(-50%);
      opacity: 0.96;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.16));
      user-select: none;
      pointer-events: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #pollenCanvas {
      z-index: 2;
      opacity: 0.64;
    }

    #maskCanvas {
      z-index: 4;
      transition: opacity 2400ms cubic-bezier(0.37, 0, 0.2, 1);
    }

    .cover-next {
      position: absolute;
      left: 50%;
      bottom: 42px;
      z-index: 6;
      padding: 10px 16px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.78rem, 0.86vw, 0.95rem);
      line-height: 1;
      letter-spacing: 0.13em;
      text-transform: lowercase;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 8px);
      transition:
        opacity 1500ms cubic-bezier(0.37, 0, 0.2, 1),
        transform 1500ms cubic-bezier(0.37, 0, 0.2, 1),
        visibility 1500ms;
      cursor: pointer;
      filter: drop-shadow(0 1px 7px rgba(90, 111, 128, 0.2));
    }

    .cover-next.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .cover-next:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.75);
      outline-offset: 5px;
    }

    .cover-next.is-disabled {
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 8px);
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: var(--white);
      color: var(--ink);
      cursor: default;
      transition: opacity 900ms cubic-bezier(0.37, 0, 0.2, 1),
        visibility 900ms cubic-bezier(0.37, 0, 0.2, 1);
    }

    .loading.is-ready {
      cursor: pointer;
    }

    .loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading__count {
      min-width: 3ch;
      font-size: clamp(0.82rem, 1.12vw, 1.18rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      line-height: 1;
      transition: opacity 760ms cubic-bezier(0.37, 0, 0.2, 1);
    }

    .loading.is-ready .loading__count {
      opacity: 0;
    }

    .loading__continue {
      position: absolute;
      left: 50%;
      bottom: 8.8vh;
      border: 0;
      padding: 12px 16px;
      background: transparent;
      color: rgba(42, 45, 46, 0.48);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.72rem, 0.78vw, 0.88rem);
      line-height: 1;
      letter-spacing: 0.12em;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, 10px, 0);
      transition:
        opacity 1100ms cubic-bezier(0.37, 0, 0.2, 1),
        transform 1100ms cubic-bezier(0.37, 0, 0.2, 1);
      cursor: pointer;
    }

    .loading.is-ready .loading__continue {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(-50%, 0, 0);
    }

    .loading.is-starting .loading__continue {
      opacity: 0;
      transform: translate3d(-50%, -4px, 0);
    }

    @media (max-width: 700px) {
      body {
        cursor: default;
      }

      .cover__bg {
        object-position: center center;
      }

      .cover__title {
        top: 14.7vh;
        width: 74vw;
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading {
        transition-duration: 1ms;
      }

      .section02__title,
      .section02__body-line,
      .section02__butterfly,
      .cover-next,
      .loading__continue {
        transition-duration: 1ms;
        animation: none;
      }
    }

    @keyframes butterflyDrift {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }

      to {
        transform:
          translate3d(var(--float-x), var(--float-y), 0)
          rotate(var(--float-rotate))
          scale(1.002);
      }
    }
  </style>
</head>
<body>
  <main class="opening" aria-label="Opening cover">
    <section class="section02" id="section02" aria-label="Section 02">
      <img class="section02__butterfly section02__butterfly--large" src="assets/butterfly_01.png" alt="">
      <img class="section02__butterfly section02__butterfly--small" src="assets/butterfly_02.png" alt="">
      <div class="section02__copy">
        <img class="section02__title" src="assets/section02_title.svg" alt="Following what drifts">
        <div class="section02__body" aria-label="Section introduction">
          <img class="section02__body-line section02__body-line--01" src="assets/section02_body_line_01.svg" alt="">
          <img class="section02__body-line section02__body-line--02" src="assets/section02_body_line_02.svg" alt="">
          <img class="section02__body-line section02__body-line--03" src="assets/section02_body_line_03.svg" alt="">
          <img class="section02__body-line section02__body-line--04" src="assets/section02_body_line_04.svg" alt="">
        </div>
      </div>
    </section>

    <section class="story-stage" id="storyStage" aria-label="Pages 03 to 06 scroll sequence">
      <div class="story-frame" id="storyFrame">
        <img class="story-img piece" data-piece="1" src="assets/page03_piece_01.png" alt="">
        <img class="story-img piece" data-piece="2" src="assets/page03_piece_02.png" alt="">
        <img class="story-img piece" data-piece="3" src="assets/page03_piece_03.png" alt="">
        <img class="story-img piece" data-piece="4" src="assets/page03_piece_04.png" alt="">
        <img class="story-img piece" data-piece="5" src="assets/page03_piece_05.png" alt="">
        <img class="story-img complete-photo" id="completePhoto" src="assets/page04_complete_photo.jpg" alt="">
        <img class="story-img later-photo photo-house" id="photoHouse" src="assets/page05_photo_02.jpg" alt="">
        <img class="story-img later-photo photo-interior" id="photoInterior" src="assets/page05_photo_01.jpg" alt="">
        <img class="story-img later-photo photo-shoes" id="photoShoes" src="assets/page06_photo_01.jpg" alt="">
        <img class="story-img later-photo photo-wall" id="photoWall" src="assets/page06_photo_02.jpg" alt="">
        <img class="story-text story-text--one" id="storyTextOne" src="assets/page03_text_01.svg" alt="Things that are all around us">
        <img class="story-text story-text--two" id="storyTextTwo" src="assets/page03_text_02.svg" alt="but cannot be seen with the naked eye">
        <div class="page07-block" id="page07Block" aria-label="Page 07">
          <img class="page07-photo" id="page07Photo" src="assets/page07_photo_01.jpg" alt="">
          <img class="page07-text" id="page07Text" src="assets/page07_text_01.svg" alt="What do you see?">
        </div>
        <div class="page08-block" id="page08Block" aria-label="Page 08">
          <img class="page08-object page08-object--one" data-page08-object="1" src="assets/page08_object_01.png" alt="">
          <img class="page08-object page08-object--two" data-page08-object="2" src="assets/page08_object_02.png" alt="">
          <img class="page08-object page08-object--three" data-page08-object="3" src="assets/page08_object_03.png" alt="">
          <img class="page08-object page08-object--four" data-page08-object="4" src="assets/page08_object_04.png" alt="">
          <div class="page08-text-wrap" id="page08TextWrap">
            <img src="assets/page08_text.svg" alt="The mystery of pollen lies in the fact that each tiny particle holds within it the possibility of creating life.">
          </div>
        </div>
      </div>
      <div class="page09-block" id="page09Block" aria-label="Page 09">
        <div class="page09-frame">
          <img class="page09-object page09-object--one" data-page09-object="1" src="assets/page09_object_01.svg" alt="">
          <img class="page09-object page09-object--two" data-page09-object="2" src="assets/page09_object_02.svg" alt="">
          <img class="page09-object page09-object--three" data-page09-object="3" src="assets/page09_object_03.svg" alt="">
          <img class="page09-object page09-object--four" data-page09-object="4" src="assets/page09_object_04.svg" alt="">
        </div>
      </div>
      <button class="page09-trigger" id="page09Trigger" type="button" aria-label="Reveal page 09"></button>
    </section>

    <section class="cover" id="cover" aria-label="Cover">
      <img class="cover__bg" src="assets/cover_bg.jpg" alt="">
      <div class="cover__veil"></div>
      <img class="cover__title" src="assets/cover_title.svg" alt="Following what drifts">
      <canvas id="pollenCanvas" aria-hidden="true"></canvas>
      <canvas id="maskCanvas" aria-hidden="true"></canvas>
      <button class="cover-next" id="coverArrow" type="button" aria-label="Reveal section 02">next &gt;&gt;</button>
    </section>

    <div class="loading" id="loading" aria-live="polite" aria-label="Loading">
      <div class="loading__count" id="loadingCount">1</div>
      <button class="loading__continue" id="loadingContinue" type="button">Move the mouse to continue</button>
    </div>
  </main>
  <div class="scroll-space" id="scrollSpace" aria-hidden="true"></div>

  <script>
    (() => {
      const loading = document.getElementById("loading");
      const loadingCount = document.getElementById("loadingCount");
      const loadingContinue = document.getElementById("loadingContinue");
      const cover = document.getElementById("cover");
      const coverArrow = document.getElementById("coverArrow");
      const section02 = document.getElementById("section02");
      const storyStage = document.getElementById("storyStage");
      const storyFrame = document.getElementById("storyFrame");
      const completePhoto = document.getElementById("completePhoto");
      const photoHouse = document.getElementById("photoHouse");
      const photoInterior = document.getElementById("photoInterior");
      const photoShoes = document.getElementById("photoShoes");
      const photoWall = document.getElementById("photoWall");
      const storyTextOne = document.getElementById("storyTextOne");
      const storyTextTwo = document.getElementById("storyTextTwo");
      const page07Block = document.getElementById("page07Block");
      const page07Text = document.getElementById("page07Text");
      const page08Block = document.getElementById("page08Block");
      const page08TextWrap = document.getElementById("page08TextWrap");
      const page09Block = document.getElementById("page09Block");
      const page09Trigger = document.getElementById("page09Trigger");
      const storyPieces = Array.from(document.querySelectorAll(".piece"));
      const page08Objects = Array.from(document.querySelectorAll(".page08-object"));
      const page09Objects = Array.from(document.querySelectorAll(".page09-object"));
      const hoverObjects = [...page08Objects, ...page09Objects];
      const maskCanvas = document.getElementById("maskCanvas");
      const pollenCanvas = document.getElementById("pollenCanvas");
      const maskCtx = maskCanvas.getContext("2d");
      const pollenCtx = pollenCanvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointerFine = window.matchMedia("(pointer: fine)").matches;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let cells = [];
      let fragments = [];
      let mistHoles = [];
      let pendingMist = [];
      let pollen = [];
      let readyForReveal = false;
      let fullyRevealed = false;
      let lastTime = performance.now();
      let revealedCount = 0;
      let revealEnergy = 0;
      let lastMistAt = 0;
      let revealFinishQueued = false;
      let revealFinishStartedAt = 0;
      let arrowShown = false;
      let sectionStarted = false;
      let storyScrollReady = false;
      let page09Ready = false;
      let page09Active = false;
      let page09StartTime = 0;
      let exitCells = [];
      let exitMaskCanvas = null;
      let exitMaskCtx = null;

      const rand = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const lerp = (start, end, t) => start + (end - start) * t;
      const smoothstep = (edge0, edge1, value) => {
        const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      };

      const pieceStart = {
        1: { x: 348, y: 82 },
        2: { x: 1164, y: 388 },
        3: { x: 348, y: 694 },
        4: { x: 1164, y: 693 },
        5: { x: 756, y: 388 }
      };

      const pieceEnd = {
        1: { x: 555, y: 0 },
        2: { x: 963, y: 0 },
        3: { x: 555, y: 774 },
        4: { x: 963, y: 468 },
        5: { x: 555, y: 468 }
      };

      function mixBox(from, to, t) {
        return {
          x: lerp(from.x, to.x, t),
          y: lerp(from.y, to.y, t),
          w: lerp(from.w, to.w, t),
          h: lerp(from.h, to.h, t)
        };
      }

      function stepMove(from, to, t, verticalFirst = false) {
        const first = smoothstep(0.02, 0.46, t);
        const second = smoothstep(0.52, 0.92, t);
        return verticalFirst
          ? { x: lerp(from.x, to.x, second), y: lerp(from.y, to.y, first) }
          : { x: lerp(from.x, to.x, first), y: lerp(from.y, to.y, second) };
      }

      function place(el, box, opacity = 1, scale = 1) {
        el.style.width = `${box.w}px`;
        el.style.height = `${box.h}px`;
        el.style.opacity = String(clamp(opacity, 0, 1));
        el.style.transform = `translate3d(${box.x}px, ${box.y}px, 0) scale(${scale})`;
      }

      function placeText(el, x, y, opacity = 1, scale = 1) {
        el.style.opacity = String(clamp(opacity, 0, 1));
        el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
      }

      function fitCanvas(canvas, context) {
        dpr = clamp(window.devicePixelRatio || 1, 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function resetMask() {
        cells = [];
        fragments = [];
        mistHoles = [];
        pendingMist = [];
        revealedCount = 0;
        revealEnergy = 0;
        revealFinishQueued = false;
        revealFinishStartedAt = 0;
        fullyRevealed = false;
        maskCanvas.style.opacity = "1";
      }

      function resetPollen() {
        const count = clamp(Math.round((width * height) / 18500), 42, 92);
        pollen = Array.from({ length: count }, () => ({
          x: rand(0, width),
          y: rand(0, height),
          r: rand(0.45, 1.65),
          alpha: rand(0.15, 0.52),
          drift: rand(0.02, 0.075),
          fall: rand(-0.006, 0.026),
          phase: rand(0, Math.PI * 2),
          glow: rand(2, 8)
        }));
      }

      function resize() {
        fitCanvas(maskCanvas, maskCtx);
        fitCanvas(pollenCanvas, pollenCtx);
        const storyFit = Math.min(width / 1920, height / 1080).toFixed(4);
        storyFrame.style.setProperty("--story-fit", storyFit);
        storyStage.style.setProperty("--story-fit", storyFit);
        resetMask();
        resetPollen();
        drawMask();
        updateStoryFromScroll();
      }

      function showCoverArrow() {
        if (arrowShown || sectionStarted || !pointerFine) return;
        arrowShown = true;
        coverArrow.classList.add("is-visible");
      }

      function revealAt(x, y, force = 1) {
        if (!readyForReveal || fullyRevealed) return;
        const now = performance.now();
        if (now - lastMistAt < (pointerFine ? 26 : 60) && force <= 1.06) return;
        lastMistAt = now;

        const baseRadius = (pointerFine ? 148 : 190) * force;
        const count = pointerFine ? 3 : 4;

        for (let i = 0; i < count; i += 1) {
          const angle = rand(0, Math.PI * 2);
          const distance = rand(0, baseRadius * 0.34);
          const radius = baseRadius * rand(0.72, 1.22);
          pendingMist.push({
            x: x + Math.cos(angle) * distance + rand(-14, 14),
            y: y + Math.sin(angle) * distance + rand(-14, 14),
            r: radius,
            born: now + rand(85, 260),
            grow: rand(1450, 2450),
            softness: rand(0.5, 0.72),
            driftX: rand(8, 26),
            driftY: rand(-12, 10)
          });
        }

        revealEnergy += (baseRadius * baseRadius * count) / Math.max(width * height, 1) * 0.34;
        revealedCount += count;

        if (revealEnergy > 0.82 || revealedCount > 138) {
          fullyRevealed = true;
          revealFinishStartedAt = performance.now();
        }
      }

      function drawMistHole(hole, time) {
        const age = Math.max(0, time - hole.born);
        const t = smoothstep(0, hole.grow, age);
        const drift = smoothstep(0, hole.grow * 1.25, age);
        const x = hole.x + hole.driftX * drift;
        const y = hole.y + hole.driftY * drift;
        const radius = hole.r * (0.28 + t * 0.92);
        const gradient = maskCtx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, "rgba(0, 0, 0, 0.92)");
        gradient.addColorStop(hole.softness, "rgba(0, 0, 0, 0.42)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        maskCtx.fillStyle = gradient;
        maskCtx.beginPath();
        maskCtx.arc(x, y, radius, 0, Math.PI * 2);
        maskCtx.fill();
      }

      function drawMask(time = performance.now()) {
        maskCtx.clearRect(0, 0, width, height);

        const finalFadeDuration = reduceMotion ? 1 : 3400;
        const finalFade = fullyRevealed
          ? smoothstep(0, finalFadeDuration, time - revealFinishStartedAt)
          : 0;
        const veilAlpha = fullyRevealed ? 0.985 * (1 - finalFade) : 0.985;

        if (veilAlpha > 0.001) {
          maskCanvas.style.opacity = "1";
          maskCtx.globalCompositeOperation = "source-over";
          maskCtx.globalAlpha = veilAlpha;
          maskCtx.fillStyle = "rgb(255, 253, 250)";
          maskCtx.fillRect(0, 0, width, height);
          maskCtx.globalAlpha = 1;
        }

        for (let i = pendingMist.length - 1; i >= 0; i -= 1) {
          if (time >= pendingMist[i].born) {
            mistHoles.push(pendingMist[i]);
            pendingMist.splice(i, 1);
          }
        }

        if (veilAlpha > 0.001) {
          maskCtx.globalCompositeOperation = "destination-out";
          for (const hole of mistHoles) drawMistHole(hole, time);
          maskCtx.globalCompositeOperation = "source-over";
        }

        if (fullyRevealed && finalFade >= 1) {
          maskCanvas.style.opacity = "0";
          if (!revealFinishQueued) {
            revealFinishQueued = true;
            window.setTimeout(showCoverArrow, reduceMotion ? 0 : 700);
          }
        }
      }

      function setupExitMask() {
        exitMaskCanvas = document.createElement("canvas");
        exitMaskCanvas.width = 180;
        exitMaskCanvas.height = Math.max(100, Math.round(180 * height / Math.max(width, 1)));
        exitMaskCtx = exitMaskCanvas.getContext("2d");
        exitCells = [];

        const w = exitMaskCanvas.width;
        const h = exitMaskCanvas.height;
        for (let i = 0; i < 58; i += 1) {
          const x = rand(-w * 0.08, w * 1.08);
          const y = rand(-h * 0.08, h * 1.08);
          const distance = Math.hypot(x - w * 0.5, y - h * 0.92);
          exitCells.push({
            x,
            y,
            r: rand(w * 0.08, w * 0.22),
            delay: distance * 15 + rand(0, 980),
            fade: rand(1700, 2900)
          });
        }
      }

      function applyExitMask(elapsed) {
        exitMaskCtx.clearRect(0, 0, exitMaskCanvas.width, exitMaskCanvas.height);
        exitMaskCtx.globalCompositeOperation = "source-over";
        exitMaskCtx.globalAlpha = 1;
        exitMaskCtx.fillStyle = "#fff";
        exitMaskCtx.fillRect(0, 0, exitMaskCanvas.width, exitMaskCanvas.height);

        exitMaskCtx.globalCompositeOperation = "destination-out";
        for (const cell of exitCells) {
          const t = clamp((elapsed - cell.delay) / cell.fade, 0, 1);
          if (t <= 0) continue;
          const radius = cell.r * (0.16 + smoothstep(0, 1, t) * 1.85);
          const gradient = exitMaskCtx.createRadialGradient(cell.x, cell.y, 0, cell.x, cell.y, radius);
          gradient.addColorStop(0, "rgba(0, 0, 0, 0.98)");
          gradient.addColorStop(0.62, "rgba(0, 0, 0, 0.5)");
          gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
          exitMaskCtx.globalAlpha = smoothstep(0, 0.92, t);
          exitMaskCtx.fillStyle = gradient;
          exitMaskCtx.beginPath();
          exitMaskCtx.arc(cell.x, cell.y, radius, 0, Math.PI * 2);
          exitMaskCtx.fill();
        }

        exitMaskCtx.globalAlpha = 1;
        exitMaskCtx.globalCompositeOperation = "source-over";
        const mask = `url(${exitMaskCanvas.toDataURL("image/png")})`;
        cover.style.webkitMaskImage = mask;
        cover.style.maskImage = mask;
        cover.style.webkitMaskSize = "100% 100%";
        cover.style.maskSize = "100% 100%";
        cover.style.webkitMaskRepeat = "no-repeat";
        cover.style.maskRepeat = "no-repeat";
      }

      function beginSection02Entrance() {
        section02.classList.add("is-entering");
        window.setTimeout(() => {
          section02.classList.add("is-settled");
          enableStoryScroll();
        }, reduceMotion ? 20 : 7300);
      }

      function enableStoryScroll() {
        if (storyScrollReady) return;
        storyScrollReady = true;
        document.body.classList.add("can-scroll");
        document.documentElement.style.overflowY = "auto";
        document.body.style.overflowY = "auto";
        window.scrollTo({ top: 0, left: 0, behavior: "instant" });
        updateStoryFromScroll();
      }

      function updateStoryFromScroll() {
        if (!storyStage || width === 0 || height === 0) return;

        const scrollY = storyScrollReady ? window.scrollY : 0;
        const introDistance = Math.max(height * 0.82, 680);
        const pinDistance = Math.max(height * 7.8, 6200);
        const intro = clamp(scrollY / introDistance, 0, 1);
        const pinned = clamp((scrollY - introDistance) / pinDistance, 0, 1);
        const legacy = clamp(pinned / 0.56, 0, 1);
        const introEase = smoothstep(0, 1, intro);

        storyStage.style.opacity = String(smoothstep(0.08, 0.66, intro));
        storyStage.style.transform = `translate3d(0, ${lerp(100, 0, introEase)}%, 0)`;
        section02.style.opacity = storyScrollReady
          ? String(1 - smoothstep(0.08, 0.86, intro))
          : "";

        const assembly = smoothstep(0.02, 0.25, legacy);
        const completeIn = smoothstep(0.16, 0.26, legacy);
        const pieceOpacity = (1 - smoothstep(0.18, 0.28, legacy)) * (1 - smoothstep(0.54, 0.6, pinned));

        for (const piece of storyPieces) {
          const id = piece.dataset.piece;
          const start = pieceStart[id];
          const end = pieceEnd[id];
          const pos = stepMove(start, end, assembly, id === "2" || id === "4");
          place(piece, { x: pos.x, y: pos.y, w: 408, h: 306 }, pieceOpacity);
        }

        const completePage04 = { x: 555, y: 0, w: 810, h: 1080 };

        const textOnePage03 = { x: 433, y: 532, scale: 1 };
        const textOnePage04 = { x: 244, y: 461, scale: 1.68 };
        const textTwoPage03 = { x: 1206, y: 313, scale: 1 };
        const textTwoPage04 = { x: 1182, y: 660, scale: 1.68 };
        const textPush = smoothstep(0.08, 0.32, legacy);
        const textFade = 1 - smoothstep(0.3, 0.39, pinned);
        placeText(
          storyTextOne,
          lerp(textOnePage03.x, textOnePage04.x, textPush),
          lerp(textOnePage03.y, textOnePage04.y, textPush),
          textFade,
          lerp(textOnePage03.scale, textOnePage04.scale, textPush)
        );
        placeText(
          storyTextTwo,
          lerp(textTwoPage03.x, textTwoPage04.x, textPush),
          lerp(textTwoPage03.y, textTwoPage04.y, textPush),
          textFade,
          lerp(textTwoPage03.scale, textTwoPage04.scale, textPush)
        );
        storyTextOne.style.zIndex = "8";
        storyTextTwo.style.zIndex = "8";

        const galleryProgress = smoothstep(0.31, 0.63, pinned);
        const galleryActive = galleryProgress * 4;
        const galleryIntro = smoothstep(0.32, 0.39, pinned);
        const galleryExit = 1 - smoothstep(0.64, 0.7, pinned);
        const galleryCards = [
          { el: completePhoto, box: completePage04, compactBox: { w: 610, h: 813 }, intro: completeIn },
          { el: photoInterior, box: { x: 0, y: 0, w: 527, h: 659 }, intro: galleryIntro },
          { el: photoHouse, box: { x: 0, y: 0, w: 529, h: 659 }, intro: galleryIntro },
          { el: photoShoes, box: { x: 0, y: 0, w: 529, h: 661 }, intro: galleryIntro },
          { el: photoWall, box: { x: 0, y: 0, w: 529, h: 659 }, intro: galleryIntro }
        ];

        galleryCards.forEach((card, index) => {
          const offset = index - galleryActive;
          const distance = Math.abs(offset);
          const distanceEase = clamp(distance / 2.6, 0, 1);
          const scale = lerp(1, 0.58, distanceEase);
          const opacity = lerp(1, 0.48, distanceEase) * card.intro * galleryExit;
          const travel = 555 + Math.min(distance, 2.2) * 42;
          const centerX = 960 + offset * travel;
          const centerY = 540 + Math.min(distance, 2.5) * 22;
          const compact = card.compactBox ? smoothstep(0.08, 0.82, distance) : 0;
          const box = card.compactBox ? {
            x: 0,
            y: 0,
            w: lerp(card.box.w, card.compactBox.w, compact),
            h: lerp(card.box.h, card.compactBox.h, compact)
          } : card.box;
          const x = centerX - (box.w * scale) / 2;
          const y = centerY - (box.h * scale) / 2;

          place(card.el, { x, y, w: box.w, h: box.h }, opacity, scale);
          card.el.style.zIndex = String(Math.max(1, Math.round(6 - distance * 1.2)));
        });

        const page07Rise = smoothstep(0.64, 0.73, pinned);
        const page07TextIn = smoothstep(0.72, 0.8, pinned);
        const page07Fade = smoothstep(0.85, 0.91, pinned);
        const page08In = smoothstep(0.91, 0.965, pinned);
        const page08ObjectsIn = [
          smoothstep(0.935, 0.972, pinned),
          smoothstep(0.948, 0.982, pinned),
          smoothstep(0.96, 0.99, pinned),
          smoothstep(0.97, 0.996, pinned)
        ];
        const page09ReadyNow = pinned > 0.992 && page08In > 0.98;

        page07Block.style.opacity = String(clamp(page07Rise * (1 - page07Fade), 0, 1));
        page07Block.style.transform = `translate3d(0, ${lerp(1080, 0, page07Rise)}px, 0)`;
        page07Text.style.opacity = String(page07TextIn * (1 - page07Fade));
        page07Text.style.transform = `translate3d(0, ${lerp(82, 0, page07TextIn)}px, 0)`;

        page08Block.style.opacity = String(page08In);
        page08Block.style.transform = "translate3d(0, 0, 0)";
        page08TextWrap.style.opacity = String(page08ObjectsIn[0]);
        page08TextWrap.style.clipPath = `inset(0 ${100 - page08ObjectsIn[0] * 100}% 0 0)`;

        page08Objects.forEach((object, index) => {
          const t = page08ObjectsIn[index] || 0;
          object.style.opacity = String(t);
          object.style.transform = `translate3d(0, ${lerp(34, 0, t)}px, 0)`;
        });

        if (page09ReadyNow !== page09Ready && !page09Active) {
          page09Ready = page09ReadyNow;
          page09Trigger.classList.toggle("is-visible", page09Ready);
          storyStage.classList.toggle("can-click-page09", page09Ready);
        }
      }

      function updatePage09(now = performance.now()) {
        if (!page09Active) return;
        const elapsed = now - page09StartTime;
        const intro = smoothstep(0, reduceMotion ? 1 : 1700, elapsed);
        const scatterStart = reduceMotion ? 1 : 5000;
        const dissolve = smoothstep(scatterStart, scatterStart + (reduceMotion ? 1 : 6200), elapsed);

        page09Block.classList.add("is-active");
        page09Block.style.opacity = String(intro);

        page09Objects.forEach((object, index) => {
          const appear = smoothstep(index * 180, 1300 + index * 180, elapsed);
          const angle = [-2.55, -1.02, 0.72, 2.24][index] || 0;
          const distance = (46 + index * 13) * dissolve;
          const driftX = Math.cos(angle) * distance;
          const driftY = Math.sin(angle) * distance;
          object.style.opacity = String(appear * lerp(1, 0.08, dissolve));
          object.style.filter = `blur(${lerp(0, 2.1, dissolve)}px)`;
          object.style.transform = `translate3d(${driftX}px, ${driftY}px, 0) scale(${lerp(1, 1.025, dissolve)})`;
        });

        if (dissolve < 1) {
          requestAnimationFrame(updatePage09);
        }
      }

      function revealPage09() {
        if (!page09Ready || page09Active) return;
        page09Active = true;
        page09StartTime = performance.now();
        page09Trigger.classList.remove("is-visible");
        storyStage.classList.remove("can-click-page09");
        page09Block.classList.add("is-active");
        requestAnimationFrame(updatePage09);
      }

      for (const object of hoverObjects) {
        object.addEventListener("pointerenter", () => {
          object.style.translate = "0 -9px";
        });
        object.addEventListener("pointerleave", () => {
          object.style.translate = "0 0";
        });
      }

      function transitionToSection02() {
        if (sectionStarted) return;
        sectionStarted = true;
        document.body.classList.add("section02-active");
        coverArrow.classList.add("is-disabled");
        section02.style.pointerEvents = "auto";

        if (reduceMotion) {
          cover.classList.add("is-hidden");
          beginSection02Entrance();
          return;
        }

        setupExitMask();
        const start = performance.now();
        const duration = 3600;
        window.setTimeout(beginSection02Entrance, 360);

        function exitFrame(now) {
          const elapsed = now - start;
          applyExitMask(elapsed);
          cover.style.opacity = String(1 - smoothstep(2400, duration, elapsed) * 0.22);

          if (elapsed < duration) {
            requestAnimationFrame(exitFrame);
          } else {
            cover.classList.add("is-hidden");
            cover.style.webkitMaskImage = "";
            cover.style.maskImage = "";
          }
        }

        requestAnimationFrame(exitFrame);
      }

      function drawPollen(delta, time) {
        pollenCtx.clearRect(0, 0, width, height);
        pollenCtx.fillStyle = "rgba(255, 249, 229, 1)";

        for (const mote of pollen) {
          mote.phase += delta * 0.00035;
          mote.x += delta * mote.drift + Math.sin(mote.phase) * 0.014 * delta;
          mote.y += delta * mote.fall + Math.cos(mote.phase * 0.78) * 0.009 * delta;

          if (mote.x > width + 18) mote.x = -18;
          if (mote.y > height + 18) mote.y = -18;
          if (mote.y < -18) mote.y = height + 18;

          const pulse = 0.72 + Math.sin(time * 0.00042 + mote.phase) * 0.16;
          pollenCtx.save();
          pollenCtx.globalAlpha = mote.alpha * pulse;
          pollenCtx.shadowColor = "rgba(255, 255, 245, 0.72)";
          pollenCtx.shadowBlur = mote.glow;
          pollenCtx.beginPath();
          pollenCtx.arc(mote.x, mote.y, mote.r, 0, Math.PI * 2);
          pollenCtx.fill();
          pollenCtx.restore();
        }
      }

      function frame(time) {
        const delta = clamp(time - lastTime, 0, 48);
        lastTime = time;

        for (const fragment of fragments) {
          fragment.life += delta;
          const ease = 1 - Math.pow(1 - fragment.life / fragment.ttl, 2);
          fragment.x += fragment.vx * delta * (0.75 + ease * 0.65);
          fragment.y += fragment.vy * delta + ease * 0.018 * delta;
          fragment.rotation += fragment.spin * delta;
        }

        if (!reduceMotion) drawPollen(delta, time);
        drawMask(time);
        requestAnimationFrame(frame);
      }

      function automaticReveal() {
        if (pointerFine || reduceMotion) return;
        const started = performance.now();
        const duration = 5200;

        function sweep(now) {
          if (!readyForReveal || fullyRevealed) return;
          const t = clamp((now - started) / duration, 0, 1);
          const x = width * (0.12 + 0.78 * t);
          const y = height * (0.58 + Math.sin(t * Math.PI * 1.45) * 0.24);
          revealAt(x, y, 1.12);
          revealAt(width * (0.5 + Math.sin(t * Math.PI) * 0.2), height * (0.25 + t * 0.42), 0.72);
          if (t < 1) {
            requestAnimationFrame(sweep);
          } else {
            window.setTimeout(() => {
              fullyRevealed = true;
              revealFinishStartedAt = performance.now();
              for (const cell of cells) cell.revealed = true;
            }, 620);
          }
        }

        requestAnimationFrame(sweep);
      }

      function beginRevealStage() {
        loading.classList.add("is-starting");
        readyForReveal = true;
        window.setTimeout(() => {
          loading.classList.add("is-hidden");
        }, reduceMotion ? 20 : 520);
        if (reduceMotion) {
          fullyRevealed = true;
          revealFinishStartedAt = performance.now();
          maskCanvas.style.opacity = "0";
          showCoverArrow();
          return;
        }
        automaticReveal();
      }

      function showContinuePrompt() {
        loading.classList.add("is-ready");
        loading.setAttribute("aria-label", "Move the mouse to continue");
      }

      function countLoading() {
        const duration = reduceMotion ? 240 : 2350;
        const start = performance.now();

        function tick(now) {
          const progress = clamp((now - start) / duration, 0, 1);
          const eased = 1 - Math.pow(1 - progress, 2.15);
          const count = Math.min(100, Math.max(1, Math.floor(eased * 100)));
          loadingCount.textContent = String(count);

          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            loadingCount.textContent = "100";
            window.setTimeout(showContinuePrompt, reduceMotion ? 30 : 520);
          }
        }

        requestAnimationFrame(tick);
      }

      function preloadAssets() {
        const sources = [
          "assets/cover_bg.jpg",
          "assets/cover_title.svg",
          "assets/butterfly_01.png",
          "assets/butterfly_02.png",
          "assets/section02_title.svg",
          "assets/section02_body_line_01.svg",
          "assets/section02_body_line_02.svg",
          "assets/section02_body_line_03.svg",
          "assets/section02_body_line_04.svg",
          "assets/page03_piece_01.png",
          "assets/page03_piece_02.png",
          "assets/page03_piece_03.png",
          "assets/page03_piece_04.png",
          "assets/page03_piece_05.png",
          "assets/page03_text_01.svg",
          "assets/page03_text_02.svg",
          "assets/page04_complete_photo.jpg",
          "assets/page05_photo_01.jpg",
          "assets/page05_photo_02.jpg",
          "assets/page06_photo_01.jpg",
          "assets/page06_photo_02.jpg",
          "assets/page07_photo_01.jpg",
          "assets/page07_text_01.svg",
          "assets/page08_object_01.png",
          "assets/page08_object_02.png",
          "assets/page08_object_03.png",
          "assets/page08_object_04.png",
          "assets/page08_text.svg",
          "assets/page09_object_01.svg",
          "assets/page09_object_02.svg",
          "assets/page09_object_03.svg",
          "assets/page09_object_04.svg"
        ];
        return Promise.all(sources.map((src) => new Promise((resolve) => {
          const image = new Image();
          image.onload = resolve;
          image.onerror = resolve;
          image.src = src;
        })));
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("scroll", updateStoryFromScroll, { passive: true });

      window.addEventListener("pointermove", (event) => {
        revealAt(event.clientX, event.clientY, 1);
      }, { passive: true });

      window.addEventListener("pointerdown", (event) => {
        revealAt(event.clientX, event.clientY, pointerFine ? 1.05 : 1.38);
        if (!pointerFine) automaticReveal();
      }, { passive: true });

      coverArrow.addEventListener("click", transitionToSection02);
      loading.addEventListener("pointermove", () => {
        if (!pointerFine || !loading.classList.contains("is-ready") || readyForReveal) return;
        beginRevealStage();
      }, { passive: true });
      loading.addEventListener("click", () => {
        if (!loading.classList.contains("is-ready") || readyForReveal) return;
        beginRevealStage();
      });
      loadingContinue.addEventListener("click", (event) => {
        event.stopPropagation();
        if (!loading.classList.contains("is-ready") || readyForReveal) return;
        beginRevealStage();
      });
      page09Trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        revealPage09();
      });
      storyStage.addEventListener("click", revealPage09);

      resize();
      requestAnimationFrame(frame);
      Promise.all([preloadAssets(), new Promise((resolve) => {
        countLoading();
        window.setTimeout(resolve, reduceMotion ? 280 : 2920);
      })]);
    })();
  </script>
</body>
</html>
